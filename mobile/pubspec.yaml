name: mobile
description: "Lamka Coaching Center - Official Native Flutter Mobile & Desktop Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1

  # Local Encrypted & Offline Storage
  flutter_secure_storage: ^9.2.4
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Hardware, Native & Biometrics
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.2.11

  # Design System, Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.6
  flutter_svg: ^2.0.17

  # Data Modeling & Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
